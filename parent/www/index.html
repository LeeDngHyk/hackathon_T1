<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>하루콩</title>
<style>
@font-face{
  font-family:'Pretendard Variable';
  font-weight:45 920;
  font-style:normal;
  font-display:swap;
  src:url('assets/fonts/PretendardVariable.woff2') format('woff2-variations');
}
:root{
  --green:#9DC15C; --green-d:#86A948; --green-deep:#3F6B2E;
  --cream:#F2F4EA; --bg:#FFFFFF; --ink:#2B2B2B; --sub:#9BA1A7;
  --border:#ECECEC; --card:#F7F8F3; --danger:#E4572E;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
#app{position:relative;height:100vh;width:100%;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);opacity:0;visibility:hidden;transform:translateX(30px);
  transition:opacity .28s ease,transform .28s ease;
}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:2}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.pad{padding:0 20px}

/* header */
.appbar{
  display:flex;align-items:center;gap:8px;padding:calc(var(--safe-top) + 10px) 16px 12px;
  border-bottom:1px solid var(--border);position:relative;flex:none;background:#fff;
}
.appbar .title{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:17px;pointer-events:none}
.iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer}
.iconbtn:active{background:#f1f1f1}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform .05s,background .15s}
.btn:active{transform:scale(.985);background:var(--green-d)}
.btn[disabled]{background:#D9DCD2;color:#fff}
.btn.ghost{background:var(--cream);color:var(--green-deep)}
.btn.line{background:#fff;border:1.5px solid var(--green);color:var(--green-deep)}
.textlink{display:block;text-align:center;color:var(--sub);font-size:14px;padding:14px;background:none;border:none;width:100%;cursor:pointer}

h1.big{font-size:23px;line-height:1.35;font-weight:800;letter-spacing:-.3px}
.muted{color:var(--sub)}
.date{color:var(--green-d);font-weight:700;font-size:13px}

/* info chip */
.info{display:flex;gap:8px;align-items:center;background:var(--cream);border-radius:12px;padding:12px 14px;font-size:13px;color:#7c8a5f}
.info .dot{width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}

/* form */
.label{font-weight:700;font-size:14px;margin:22px 0 8px}
.label .req{color:var(--danger)}
.field{width:100%;padding:15px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.field::placeholder{color:#C4C8CC}
textarea.field{min-height:200px;resize:none;line-height:1.6}
.seg{display:flex;gap:12px}
.seg button{flex:1;padding:16px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.seg button.on{border-color:var(--green);background:#F3F8EA;color:var(--green-deep)}

/* cards / list */
.section-title{font-weight:800;font-size:16px;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}
.hcards{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.hcards::-webkit-scrollbar{display:none}
.storycard{flex:none;width:150px;scroll-snap-align:start;cursor:pointer}
.thumb{width:100%;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/11;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.thumb .dur{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px}
.storycard .t{font-weight:700;font-size:13.5px;margin-top:8px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.storycard .d{color:var(--sub);font-size:11.5px;margin-top:3px}

.tip{background:var(--cream);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#8a936f;line-height:1.5;margin-top:14px}

/* diary CTA on home */
.diarycta{margin-top:22px;background:linear-gradient(180deg,#F7F9F0,#EEF3E1);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.diarycta h3{font-size:15px;margin-bottom:4px}
.diarycta p{font-size:13px;color:#7c8a5f;line-height:1.5;max-width:80%}
.diarycta .go{margin-top:14px;background:#fff;color:var(--green-deep);border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px}
.diarycta .m{position:absolute;right:10px;bottom:6px;width:70px}

/* bottom tabs */
.tabbar{flex:none;display:flex;border-top:1px solid var(--border);background:#fff;padding-bottom:var(--safe-bot)}
.tabbar button{flex:1;background:none;border:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B7BCC2;font-size:11px;font-weight:600;cursor:pointer}
.tabbar button.on{color:var(--green-d)}
.tabbar svg{width:23px;height:23px}

/* segmented tabs (list top) */
.segtab{display:flex;gap:26px;padding:14px 20px 0;border-bottom:1px solid var(--border)}
.segtab button{background:none;border:none;padding:6px 0 12px;font-size:14.5px;font-weight:700;color:#BFC4C9;position:relative;cursor:pointer}
.segtab button.on{color:var(--green-deep)}
.segtab button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:3px;background:var(--green)}

/* list rows */
.listcard{cursor:pointer;margin-bottom:20px}
.listcard .thumb{aspect-ratio:16/9}
.listcard .t{font-weight:700;font-size:15px;margin-top:10px}
.listcard .d{color:var(--sub);font-size:12.5px;margin-top:3px}

/* player */
.player{width:100%;aspect-ratio:16/10;position:relative;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player .pbar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;align-items:center;gap:10px;color:#fff;font-size:12px;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent)}
.player .track{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:3px;position:relative}
.player .track i{position:absolute;left:0;top:0;bottom:0;width:22%;background:var(--green);border-radius:3px}
.play-c{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--green-deep);font-size:24px}

.answerlink{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--border);border-radius:14px;margin:16px 20px;cursor:pointer}
.answerlink .av{width:30px;height:30px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center}
.answerlink .g{flex:1;font-weight:700;font-size:14.5px}
.answerlink .c{color:var(--sub)}

.script{background:var(--card);border-radius:14px;padding:16px;font-size:13.5px;line-height:1.75;color:#3a3a3a;white-space:pre-wrap}
.script b{color:var(--green-deep)}

/* report */
.repcard{border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.repcard .badge{width:44px;height:44px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.repcard .rt{font-weight:700;font-size:14.5px}
.repcard .rd{color:var(--sub);font-size:12.5px;margin-top:2px}
.repsec{margin-top:18px}
.repsec .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.repsec .h .n{width:22px;height:22px;border-radius:7px;background:var(--green);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.repsec .body{background:var(--card);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:#3d3d3d}
.quote{background:#F3F8EA;border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:#4a5a2e;margin:8px 0;line-height:1.6}
.growbtn{margin:8px 0 4px}
.repsec .h.plain{font-size:16px;margin-bottom:10px}
.hexwrap{display:flex;justify-content:center;margin:4px 0 10px}

/* generating */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;gap:14px}
.progress{width:200px;height:8px;background:#EDEFE6;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:width .3s}

/* splash */
.splash{background:#fff;align-items:center;justify-content:center;text-align:center;gap:0}
.splash .logo{width:210px;margin-bottom:auto;margin-top:34vh}
.splash .cta-wrap{width:100%;padding:0 24px calc(var(--safe-bot) + 30px)}
.floatbean{position:absolute;opacity:.9}

.emptybox{background:var(--card);border-radius:14px;min-height:190px;display:flex;align-items:center;justify-content:center;color:#B7BCC2;font-size:14px;text-align:center;padding:20px;cursor:text}
.chararea{width:120px;margin:6px auto 2px;display:block}
.tag{display:inline-block;background:#F3F8EA;color:var(--green-deep);font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
.answer-bubble{background:#F3F8EA;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:#3d4a2a;margin:14px 20px}
.answer-bubble .who{font-weight:800;color:var(--green-deep);font-size:12px;margin-bottom:5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- shared SVG helpers ---------- */
const bean = (s=90)=>`<svg width="${s}" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">

<path d="M53 76c3 4 11 4 14 0" stroke="#43502c" stroke-width="2.6" stroke-linecap="round" fill="none"/>

<path d="M60 26C48 26 40 40 40 66c0 28 10 50 20 50V26z" fill="#B7D775"/>
<path d="M60 30c-2-10 2-20 12-24 2 8-2 18-12 24z" fill="#7BAe3f"/>
</svg>`;
const leafDeco = (s=18,c='#B7D775')=>`<svg width="${s}" viewBox="0 0 28 18" xmlns="http://www.w3.org/2000/svg"><path d="M2 16C2 6 12 2 26 2 24 12 14 16 2 16z" fill="${c}"/></svg>`;

/* 6각형 성장 지표 레이더 차트 */
function hexChart(vals, size){
  size=size||260;
  const labels=['인내심','배려심','협동심','공감능력','자기조절력','표현력'];
  const cx=size/2, cy=size/2, R=size*0.30;
  const angle=i=>-90+i*60;
  const pt=(i,r)=>{const a=angle(i)*Math.PI/180;return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  const rings=[0.25,0.5,0.75,1].map(f=>`<polygon points="${labels.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#E4E8DA" stroke-width="1"/>`).join('');
  const axes=labels.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E4E8DA" stroke-width="1"/>`;}).join('');
  const dataPts=labels.map((l,i)=>pt(i,R*vals[l]).join(',')).join(' ');
  const labelEls=labels.map((l,i)=>{const [x,y]=pt(i,R+26);return `<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="#5c6650" text-anchor="middle" dominant-baseline="middle">${l}</text>`;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${axes}<polygon points="${dataPts}" fill="var(--green)" fill-opacity="0.55" stroke="var(--green-d)" stroke-width="2"/>${labelEls}</svg>`;
}

/* scene illustration generator (storybook look) */
function scene(seed){
  const sets=[
    ['#BFE3F5','#D9F0C9','#F7E9A8'],['#F9DCC4','#FBEFC8','#CDE9C0'],
    ['#DCD6F7','#EAD9F2','#F7D9E3'],['#CDEFE6','#DBF2C9','#F6E7B8']
  ];
  const c=sets[seed%sets.length];
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <rect width="160" height="100" fill="${c[0]}"/>
  <circle cx="128" cy="24" r="13" fill="${c[2]}"/>
  <path d="M0 74c22-14 40-14 60 0 20-14 40-14 62 0 14-8 26-8 38-2V100H0z" fill="${c[1]}"/>
  <path d="M0 88c30-12 52-12 82 0 26-10 50-10 78 0V100H0z" fill="#B7D775" opacity=".9"/>
  <g transform="translate(58 40) scale(.9)">${bean(46)}</g>
  <ellipse cx="70" cy="92" rx="26" ry="5" fill="#000" opacity=".05"/>
  </svg>`;
}

/* tab icons */
const ic = {
  home:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  diary:`<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h11l3 3v13H5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none"><path d="M12 6C10 4.5 7 4 4 5v13c3-1 6-.5 8 1 2-1.5 5-2 8-1V5c-3-1-6-.5-8 1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 7v11" stroke="currentColor" stroke-width="1.8"/></svg>`,
  report:`<svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12v5M12 9v8M15 14v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
};

  {id:2, t:'친구와 싸웠어요', d:'2026.07.15 (화)', kind:'동화 리포트'},
  {id:3, t:'내면 자아 성장 기록 · 7월', d:'2026.07.16 (수)', kind:'누적 리포트', cum:true},
];

/* ---------- router ---------- */
const app = document.getElementById('app');
let stack=[];
const screens={};
function reg(id,html){screens[id]=html;}
function go(id,opts={}){
  const prev=document.querySelector('.screen.active');
  if(opts.replace && stack.length) stack.pop();
  if(!opts.noPush && (!stack.length || stack[stack.length-1]!==id)) stack.push(id);
  render(id);
}
function back(){
  if(stack.length>1){stack.pop();render(stack[stack.length-1]);}
}
function render(id){
  app.innerHTML='';
  const el=document.createElement('div');
  el.className='screen active';
  el.innerHTML=typeof screens[id]==='function'?screens[id]():screens[id];
  app.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('active'));
  if(binds[id]) binds[id](el);
  const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=0;
}
const binds={};

/* ---------- app state ---------- */
const state={name:'',birth:'',gender:'',diary:'',intent:'',tab:'home'};

/* ===== SPLASH ===== */
reg('splash',()=>`
<div class="screen splash active" style="position:absolute;inset:0">
  <div class="floatbean" style="top:9%;left:9%">${bean(34)}</div>
  <div class="floatbean" style="top:6%;right:10%">${sparkle(20)}</div>
  <div class="floatbean" style="top:50%;right:7%;transform:rotate(14deg)">${beanPod(52)}</div>
  <div class="floatbean" style="bottom:22%;left:9%">${bean(38)}</div>
  <div class="floatbean" style="bottom:20%;right:9%">${heartDeco(20)}</div>
  <div class="floatbean" style="bottom:13%;right:8%">${leafDeco(20)}</div>
